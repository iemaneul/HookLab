services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hooklab
      POSTGRES_PASSWORD: hooklab
      POSTGRES_DB: hooklab
    ports: ["5432:5432"]
    volumes: ["hooklab_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hooklab"]
      interval: 5s
      timeout: 5s
      retries: 10
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://hooklab:hooklab@postgres:5432/hooklab?schema=public
      JWT_SECRET: change-this-in-production
      CLIENT_URL: http://localhost:5173
    ports: ["3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_SOCKET_URL: http://localhost:3001
    ports: ["5173:5173"]
volumes:
  hooklab_data:
